spring.application.name=mayday
spring.config.import=optional:classpath:database.properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
mayday.public.key=classpath:mayday.pub
mayday.private.key=classpath:mayday.key
logging.level.org.springframework.security=INFO
# Đã có database in-memory là H2, có thể dùng khi test
# Nếu kết nối với database chung, KHÔNG ghi vào file này mà ghi vào biến môi trường (environment variables) hoặc
# file database.properties
# File database.properties sẽ nằm trong .gitignore, KHÔNG được push lên remote trên GitHub
